{% load static %}

<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ดูดวงศาสตร์จีน</title>

    <link rel="stylesheet" href="{% static 'home.css' %}">

</head>


<body>


<div class="container">


    <!-- ========================================
         LEFT SECTION
    ========================================= -->

    <div class="left-section">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-circle">
                ☯
            </div>

            <div>

                <h1>
                    ดูดวงศาสตร์จีน
                </h1>

                <p>
                    ดูดวง • เข้าใจชีวิต • เปลี่ยนอนาคต
                </p>

            </div>

        </div>


        <!-- CHINESE QUOTE -->

        <div class="quote-chinese">

            <span>
                知<br>
                命<br>
                不<br>
                惑
            </span>

            <span>
                日<br>
                日<br>
                是<br>
                好<br>
                日
            </span>

        </div>


        <!-- DESCRIPTION -->

        <p class="description">

            When Yin and Yang are in harmony,
            destiny flows in your favor.

        </p>


    </div>


    <!-- ========================================
         RIGHT SECTION
    ========================================= -->

    <div class="right-section">


        <div class="card">


            <!-- FORM HEADER -->

            <div class="form-header">

                <span class="form-kicker">
                    DESTINY JOURNEY
                </span>

                <h2>
                    ข้อมูลของคุณ
                </h2>

                <p>
                    กรอกข้อมูลเพื่อเริ่มต้นเส้นทางแห่งโชคชะตา
                </p>

            </div>


            <!-- =================================
                 NAME
            ================================== -->

            <div class="form-group name-group">


                <label>

                    <span class="label-icon">
                        ✦
                    </span>

                    ชื่อ - นามสกุล

                </label>


                <div class="name-inputs">


                    <!-- FIRST NAME -->

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="ชื่อจริง"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <!-- LAST NAME -->

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="นามสกุล"
                            autocomplete="family-name"
                            required
                        >

                    </div>


                </div>


            </div>


            <!-- =================================
                 GENDER
            ================================== -->

            <div class="form-group">


                <label>

                    <span class="label-icon">
                        ✦
                    </span>

                    เพศ

                </label>


                <div class="gender-options">


                    <!-- MALE -->

                    <label class="gender-option">

                        <input
                            type="radio"
                            name="gender"
                            value="male"
                            required
                        >

                        <span class="gender-card">

                            <span class="radio-custom"></span>

                            <span>
                                ชาย
                            </span>

                        </span>

                    </label>


                    <!-- FEMALE -->

                    <label class="gender-option">

                        <input
                            type="radio"
                            name="gender"
                            value="female"
                        >

                        <span class="gender-card">

                            <span class="radio-custom"></span>

                            <span>
                                หญิง
                            </span>

                        </span>

                    </label>


                </div>


            </div>


            <!-- =================================
                 BIRTH DATE
            ================================== -->

            <div class="form-group">


                <label for="birthDate">

                    <span class="label-icon">
                        ✦
                    </span>

                    วันเดือนปีเกิด

                </label>


                <div class="input-wrapper">

                    <input
                        type="date"
                        id="birthDate"
                        name="birthDate"
                        required
                    >

                </div>


            </div>


            <!-- =================================
                 BIRTH TIME
            ================================== -->

            <div class="form-group">


                <label for="birthTime">

                    <span class="label-icon">
                        ✦
                    </span>

                    เวลาเกิด

                    <span class="optional">
                        Optional
                    </span>

                </label>


                <div class="input-wrapper">

                    <input
                        type="time"
                        id="birthTime"
                        name="birthTime"
                    >

                </div>


            </div>


            <!-- =================================
                 NEXT BUTTON
            ================================== -->

            <button
                class="next-btn"
                type="button"
            >

                <span>
                    Next
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


        </div>


    </div>


</div>


</body>

</html>
